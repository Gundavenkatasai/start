        "url": "https://openbench.io",

          },
          {
            "@type": "Person",
            "name": "Priya",
            "jobTitle": "Head of Technology & QA"
          }
        ],
        "areaServed": ["US", "GB", "EU", "IN"],
        "priceRange": "$$$$"
      }

  <body class="bg-background text-ink-primary font-sans antialiased min-h-screen selection:bg-accent-cobalt selection:text-white">
